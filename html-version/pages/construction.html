<div class="order-page">
  <div class="order-header" style="background-image: url('../assets_images/construction.jpeg')">
    <div class="order-header-content">
      <a href="/" class="btn-back" data-route="/">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M15 18L9 12L15 6" stroke="#5630FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
    <h1 class="order-title">Construction</h1>
  </div>

  <div class="order-form-container">
    <div class="order-form">
      <h2 class="form-title">Formulaire de commandes</h2>
      
      <div class="form-field">
        <label class="form-label">
          Nom complet: <span class="required">*</span>
        </label>
        <input type="text" name="nomComplet" placeholder="Ex: Sarah Pierre" class="form-input" required />
      </div>

      <div class="form-field">
        <label class="form-label">
          Type de produit: <span class="required">*</span>
        </label>
        <div class="form-select-wrapper">
          <select name="typeProduit" class="form-select" required>
            <option value="">Sélectionner...</option>
            <option value="gravier">Gravier</option>
            <option value="sable">Sable</option>
            <option value="pyruc">PYRUC</option>
            <option value="roches">Roches</option>
            <option value="engin">Engin lourd</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">Sous-type</label>
        <div class="form-select-wrapper">
          <select name="sousType" class="form-select">
            <option value="">Sélectionner...</option>
            <option value="sable-brut">Sable brut</option>
            <option value="sable-moulu">Sable moulu</option>
            <option value="gravier-riviere">Gravier rivière</option>
            <option value="autre">Autre</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field form-field-half">
          <label class="form-label">
            Quantité: <span class="required">*</span>
          </label>
          <input type="number" name="quantite" placeholder="Ex: 10" class="form-input" min="1" required />
        </div>

        <div class="form-field form-field-half">
          <label class="form-label">
            Unité: <span class="required">*</span>
          </label>
          <div class="form-select-wrapper">
            <select name="unite" class="form-select" required>
              <option value="m³">m³</option>
              <option value="tonnes">Tonnes</option>
              <option value="unites">Unités</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">
          Site / Chantier: <span class="required">*</span>
        </label>
        <div class="form-select-wrapper">
          <select name="siteChantier" class="form-select" required>
            <option value="">Sélectionner...</option>
            <option value="chantier1">Chantier 1</option>
            <option value="chantier2">Chantier 2</option>
            <option value="autre">Autre</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">
          Date de livraison: <span class="required">*</span>
        </label>
        <input type="datetime-local" name="dateLivraison" class="form-input" required />
      </div>

      <div class="form-field">
        <label class="form-label">
          Mode de transport: <span class="required">*</span>
        </label>
        <div class="form-select-wrapper">
          <select name="modeTransport" class="form-select" required>
            <option value="">Sélectionner...</option>
            <option value="jtrans">JTRANS camion</option>
            <option value="client">Client vient chercher</option>
            <option value="autre">Autre</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">
          Responsable chantier: <span class="required">*</span>
        </label>
        <input type="text" name="responsable" placeholder="Nom + téléphone" class="form-input" required />
      </div>

      <div class="form-field">
        <label class="form-label">Notes / Instructions spéciales</label>
        <textarea name="instructions" placeholder="Instructions optionnelles..." class="form-textarea" rows="4"></textarea>
      </div>

      <div class="form-field">
        <label class="form-label-toggle">
          <input type="checkbox" name="accuséReception" class="toggle-input" />
          <span class="toggle-label">Accusé de réception (Valider la réception sur site)</span>
        </label>
      </div>

      <div class="form-submit-section">
        <button type="submit" class="btn-submit" onclick="handleConstructionSubmit(event)">Envoyer</button>
        <p class="form-help-text">Veuillez remplir tous les champs marqués d'un astérisque (*) avant d'envoyer le formulaire.</p>
      </div>
    </div>
  </div>
</div>

<script>
function handleConstructionSubmit(e) {
  e.preventDefault()
  const form = e.target.closest('.order-form')
  const formData = new FormData(form)
  const data = Object.fromEntries(formData)
  
  // Validation
  const required = ['nomComplet', 'typeProduit', 'quantite', 'unite', 'siteChantier', 'dateLivraison', 'modeTransport', 'responsable']
  const missing = required.filter(field => !data[field])
  
  if (missing.length > 0) {
    alert('Veuillez remplir tous les champs obligatoires')
    return
  }
  
  alert('Commande envoyée avec succès!')
  form.reset()
}
</script>
