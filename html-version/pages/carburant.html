<div class="order-page">
  <div class="order-header" style="background-image: url('../assets_images/pngtree-rear-and-side-view-of-tanker-truck-vehicle-image_15661785.jpg')">
    <div class="order-header-content">
      <a href="/" class="btn-back" data-route="/">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M15 18L9 12L15 6" stroke="#5630FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
    <h1 class="order-title">Carburant</h1>
  </div>

  <div class="order-form-container">
    <div class="order-form">
      <h2 class="form-title">Formulaire de commandes</h2>
      
      <div class="form-field">
        <label class="form-label">
          Nom complet: <span class="required">*</span>
        </label>
        <input type="text" name="nomComplet" placeholder="Ex: Sarah Pierre" class="form-input" required />
      </div>

      <div class="form-field">
        <label class="form-label">
          Type de carburant: <span class="required">*</span>
        </label>
        <div class="form-select-wrapper">
          <select name="typeCarburant" class="form-select" required>
            <option value="">Sélectionner...</option>
            <option value="diesel">Diesel</option>
            <option value="kerosene">Kérosène</option>
            <option value="petrole">Pétrole</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">
          Type de vente: <span class="required">*</span>
        </label>
        <div class="form-select-wrapper">
          <select name="typeVente" class="form-select" required>
            <option value="">Sélectionner...</option>
            <option value="detail">Vente au détail</option>
            <option value="gros">Vente en gros</option>
            <option value="transfert">Transfert interne/inter-site</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">
          Quantité (gallons): <span class="required">*</span>
        </label>
        <input type="number" name="quantite" placeholder="Ex: 250" class="form-input" min="1" required />
      </div>

      <div class="form-field">
        <label class="form-label">
          Site / Destination: <span class="required">*</span>
        </label>
        <div class="form-select-wrapper">
          <select name="siteDestination" class="form-select" required>
            <option value="">Sélectionner...</option>
            <option value="site1">Site 1</option>
            <option value="site2">Site 2</option>
            <option value="autre">Autre</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field form-field-half">
          <label class="form-label">
            Mode de paiement: <span class="required">*</span>
          </label>
          <div class="form-select-wrapper">
            <select name="modePaiement" class="form-select" required>
              <option value="">Sélectionner...</option>
              <option value="especes">Espèces</option>
              <option value="mobile">Mobile Money</option>
              <option value="carte">Carte</option>
            </select>
          </div>
        </div>

        <div class="form-field form-field-half">
          <label class="form-label">
            Monnaie: <span class="required">*</span>
          </label>
          <div class="form-select-wrapper">
            <select name="monnaie" class="form-select" required>
              <option value="">Sélectionner...</option>
              <option value="xaf">XAF</option>
              <option value="usd">USD</option>
              <option value="htg">HTG</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">
          Date et heure de livraison: <span class="required">*</span>
        </label>
        <input type="datetime-local" name="dateLivraison" class="form-input" required />
      </div>

      <div class="form-field">
        <label class="form-label">
          Contact client / responsable: <span class="required">*</span>
        </label>
        <input type="text" name="contact" placeholder="Nom et téléphone" class="form-input" required />
      </div>

      <div class="form-field">
        <label class="form-label-toggle">
          <input type="checkbox" name="avantApresVente" class="toggle-input" />
          <span class="toggle-label">Bouton avant/après vente (pour suivi du stock réel)</span>
        </label>
      </div>

      <div class="form-field">
        <label class="form-label">Notes supplémentaires</label>
        <textarea name="notes" placeholder="Remarques optionnelles..." class="form-textarea" rows="4"></textarea>
      </div>

      <div class="form-submit-section">
        <button type="submit" class="btn-submit" onclick="handleCarburantSubmit(event)">Envoyer</button>
        <p class="form-help-text">Veuillez remplir tous les champs marqués d'un astérisque (*) avant d'envoyer le formulaire.</p>
      </div>
    </div>
  </div>
</div>

<script>
function handleCarburantSubmit(e) {
  e.preventDefault()
  const form = e.target.closest('.order-form')
  const formData = new FormData(form)
  const data = Object.fromEntries(formData)
  
  const required = ['nomComplet', 'typeCarburant', 'typeVente', 'quantite', 'siteDestination', 'modePaiement', 'monnaie', 'dateLivraison', 'contact']
  const missing = required.filter(field => !data[field])
  
  if (missing.length > 0) {
    alert('Veuillez remplir tous les champs obligatoires')
    return
  }
  
  alert('Commande envoyée avec succès!')
  form.reset()
}
</script>
