<div class="order-page">
  <div class="order-header" style="background-image: url('../assets_images/camions-ordures-ville-quebec-cueillette-ordures-menageres-camion-benne-ville-de-quebec-bacs-ordures-et-recyclage-ville-de-quebec-en-bord-de-ruebas-vert-bac-bleu-64630.avif')">
    <div class="order-header-content">
      <a href="/" class="btn-back" data-route="/">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M15 18L9 12L15 6" stroke="#5630FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
    <h1 class="order-title">Assainissement</h1>
  </div>

  <div class="order-form-container">
    <div class="order-form">
      <h2 class="form-title">Formulaire de commandes</h2>
      
      <div class="form-field">
        <label class="form-label">
          Nom complet: <span class="required">*</span>
        </label>
        <input type="text" name="nomComplet" placeholder="Ex: Sarah Pierre" class="form-input" required />
      </div>

      <div class="form-field">
        <label class="form-label">
          Type de service: <span class="required">*</span>
        </label>
        <div class="form-select-wrapper">
          <select name="typeService" class="form-select" required>
            <option value="">Sélectionner...</option>
            <option value="collecte">Collecte</option>
            <option value="transport">Transport</option>
            <option value="vidange">Vidange</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field form-field-half">
          <label class="form-label">
            Quantité / Volume: <span class="required">*</span>
          </label>
          <input type="number" name="quantite" placeholder="Ex: 5" class="form-input" min="1" required />
        </div>

        <div class="form-field form-field-half">
          <label class="form-label">
            Unité: <span class="required">*</span>
          </label>
          <div class="form-select-wrapper">
            <select name="unite" class="form-select" required>
              <option value="m³">m³</option>
              <option value="camions">Nombre de camions</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">
          Site / Lieu de collecte: <span class="required">*</span>
        </label>
        <input type="text" name="siteCollecte" placeholder="Adresse précise du site" class="form-input" required />
      </div>

      <div class="form-field">
        <label class="form-label">
          Date et heure: <span class="required">*</span>
        </label>
        <input type="datetime-local" name="dateHeure" class="form-input" required />
      </div>

      <div class="form-field">
        <label class="form-label">
          Camion attribué: <span class="required">*</span>
        </label>
        <div class="form-select-wrapper">
          <select name="camion" class="form-select" required>
            <option value="">Sélectionner...</option>
            <option value="camion1">Camion 1</option>
            <option value="camion2">Camion 2</option>
            <option value="camion3">Camion 3</option>
            <option value="flotte">Flotte disponible</option>
          </select>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">
          Responsable site / client: <span class="required">*</span>
        </label>
        <input type="text" name="responsable" placeholder="Nom et téléphone" class="form-input" required />
      </div>

      <div class="form-field">
        <label class="form-label-toggle">
          <input type="checkbox" name="validationLivraison" class="toggle-input" />
          <span class="toggle-label">Validation à la livraison (Check client et photo optionnelle)</span>
        </label>
      </div>

      <div class="form-field">
        <label class="form-label">Notes supplémentaires</label>
        <textarea name="notes" placeholder="Remarques optionnelles..." class="form-textarea" rows="4"></textarea>
      </div>

      <div class="form-submit-section">
        <button type="submit" class="btn-submit" onclick="handleAssainissementSubmit(event)">Envoyer</button>
        <p class="form-help-text">Veuillez remplir tous les champs marqués d'un astérisque (*) avant d'envoyer le formulaire.</p>
      </div>
    </div>
  </div>
</div>

<script>
function handleAssainissementSubmit(e) {
  e.preventDefault()
  const form = e.target.closest('.order-form')
  const formData = new FormData(form)
  const data = Object.fromEntries(formData)
  
  const required = ['nomComplet', 'typeService', 'quantite', 'unite', 'siteCollecte', 'dateHeure', 'camion', 'responsable']
  const missing = required.filter(field => !data[field])
  
  if (missing.length > 0) {
    alert('Veuillez remplir tous les champs obligatoires')
    return
  }
  
  alert('Commande envoyée avec succès!')
  form.reset()
}
</script>
